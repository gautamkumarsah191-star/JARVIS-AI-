
name: Build JARVIS Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP not found"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/jarvis-src"
          unzip -o "$ZIP_FILE" -d "$RUNNER_TEMP/jarvis-src"

          PROJECT_ROOT=$(find "$RUNNER_TEMP/jarvis-src" -type f -path '*/app/pubspec.yaml' -print -quit | sed 's#/app/pubspec.yaml##')

          if [ -z "$PROJECT_ROOT" ]; then
            echo "Flutter project not found"
            exit 1
          fi

          cp -a "$PROJECT_ROOT/." "$GITHUB_WORKSPACE/"
          test -f app/pubspec.yaml
          test -f app/android/gradlew || true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          
